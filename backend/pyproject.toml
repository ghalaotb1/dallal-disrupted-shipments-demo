[project]
name = "dallal-backend"
version = "0.1.0"
description = "Dallal (دلّال) data foundation, ML tasks and agentic backend for disrupted-shipment handling"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "requests>=2.31",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "openpyxl>=3.1",
  "scikit-learn>=1.5",
  "joblib>=1.3",
  "scipy>=1.11",  # scipy.optimize.milp (coordinated recovery)
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
ml = ["torch>=2.2"]  # only the sequence-model experiment (dallal.ml.sequence); serving needs scikit-learn + joblib only
report = ["matplotlib>=3.8"]  # charts for the evaluation report (dallal.eval.charts)
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
dallal-data = "dallal.data.cli:main"
dallal-agent = "dallal.agent.cli:main"
dallal-api = "dallal.api.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dallal*"]

[tool.setuptools.package-data]
"dallal.recovery" = ["actions.yaml"]
"dallal.agent.v2" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["realdata: needs downloaded datasets under backend/.data (skipped when absent)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B905"]
