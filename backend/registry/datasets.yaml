  - id: amazon_lmrrc
    name: "Amazon Last Mile Routing Research Challenge 2021 (training inputs)"
    decision: select
    evidence_level: data
    data_kind: observed
    homepage: https://registry.opendata.aws/amazon-last-mile-challenges
    paper: https://doi.org/10.1287/trsc.2022.1173
