  # ─────────────────────────────── REJECTED ───────────────────────────────
  - id: hf_olist_delivery_risk
    name: "HF samuelalex37/olist-delivery-risk-data (pre-engineered Olist table)"
    decision: reject
    evidence_level: schema
    data_kind: derived_public
    homepage: https://huggingface.co/datasets/samuelalex37/olist-delivery-risk-data
    license: "CC BY-NC-SA 4.0"
    reason: "Third-party derivative of Olist with its own frozen split and opaque feature engineering (53 cols, distance_km derived from geolocation lookup). We rebuild from the raw tables so we control timestamps, leakage and the time-aware split. Its card is a useful cross-check of the ~8.1% late rate and the banned-column list."

