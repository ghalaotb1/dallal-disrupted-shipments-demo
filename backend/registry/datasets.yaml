    scale: "6,112 training routes, 1.46M packages, 5 US metros, Jul-Aug 2018"
    supports: [stop_level_delivery_outcome, attempted_vs_delivered, time_window_context, route_sequence_behavior, zone_level_aggregation]
    does_not_support: [failure_reason, attempt_count_per_package, recipient_contact, recovery_actions]
    caveats:
      - "scan_status in {DELIVERED, DELIVERY_ATTEMPTED, REJECTED}; no attempt timestamp/count and no reason."
