# Dallal dataset registry — single source of truth for every external dataset we audited.
#
#   decision:       select | secondary | reject
#   evidence_level: how deeply we actually inspected it
#                     data   = downloaded and profiled (see docs/data/EDA_*.md)
#                     schema = official schema / dataset card / data paper only
#                     card   = landing page or search snippet only (NOT a verified conclusion)
#   data_kind:      observed | derived_public | simulated | synthetic | reference
#   files:          only for datasets we reproduce locally; url + expected size (+ sha256 when published).
#                   Actual sha256 of what we downloaded is recorded in registry/datasets.lock.json.
#
# Raw data is never committed. `dallal-data fetch <id>` reproduces it under backend/.data/raw/<id>/.

version: 1
generated: "2026-10-15"

